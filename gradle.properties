# JVM args for the Gradle daemon. 2g heap is comfortable for Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for Jetpack Compose).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources/R class needed by this module (faster builds).
android.nonTransitiveRClass=true

# Parallel + caching for faster builds.
org.gradle.parallel=true
org.gradle.caching=true
